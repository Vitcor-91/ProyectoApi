name: actions-pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

  bd-conection:
    needs: [build-pipeline]
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

      - name: Test database connection
        env:
          ConnectionStrings__DefaultConnection: "Server=${{ secrets.MYSQL_SERVER }};Port=${{ secrets.MYSQL_PORT }};Database=${{ secrets.MYSQL_DATABASE }};User=${{ secrets.MYSQL_USER }};Password=${{ secrets.MYSQL_PASSWORD }};"

        run: |
          output=$(dotnet test ./ProyectoApi.slnx \
            --no-build \
            --configuration Release \
            --filter "Category=DatabaseConnection" \
            --logger "console;verbosity=normal" 2>&1) || {
              echo "$output"
              exit 1
            }

          echo "$output"

          if echo "$output" | grep -q "No test matches the given testcase filter"; then
            echo "ERROR: No se encontró ningún test con el filtro especificado."
            exit 1
          fi
