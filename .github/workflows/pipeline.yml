name: actions-pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: |
            ProyectoApi.Api/bin/Release/net10.0/
            ProyectoApi.Application/bin/Release/net10.0/
            ProyectoApi.Domain/bin/Release/net10.0/
            ProyectoApi.Infrastructure/bin/Release/net10.0/
            ProyectoApi.UnitTests/bin/Release/net10.0/
          retention-days: 1

  bd-conection:
    needs: [build-pipeline]
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dotnet-build

      - name: Verify build artifacts
        run: |
          echo "Contenido de UnitTests:"
          ls -la ProyectoApi.UnitTests/bin/Release/net10.0/

      - name: Wait for MySQL
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        run: |
          echo "Esperando a que MySQL esté disponible..."

          for i in {1..30}; do

            if docker run --rm \
              --network host \
              mysql:8.0 \
              mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -p"${MYSQL_ROOT_PASSWORD}" \
              --silent; then

              echo "MySQL está listo."
              exit 0
            fi

            echo "Intento $i/30 - MySQL todavía no está disponible."
            sleep 2

          done

          echo "ERROR: MySQL no estuvo disponible."

          docker ps -a

          exit 1

      - name: Test database connection
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=${{ secrets.MYSQL_DATABASE }};User=root;Password=${{ secrets.MYSQL_ROOT_PASSWORD }};"

        run: |
          dotnet vstest \
          ./ProyectoApi.UnitTests/bin/Release/net10.0/ProyectoApi.UnitTests.dll \
          --TestCaseFilter:"FullyQualifiedName~DatabaseConnection" \
          --Logger:"console;verbosity=normal"
