name: actions-pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: |
            ProyectoApi.Api/bin/Release/net10.0/
            ProyectoApi.Application/bin/Release/net10.0/
            ProyectoApi.Domain/bin/Release/net10.0/
            ProyectoApi.Infrastructure/bin/Release/net10.0/
            ProyectoApi.UnitTests/bin/Release/net10.0/
          retention-days: 1

  bd-conection:
    needs: [build-pipeline]
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_ROOT_USER: ${{ secrets.MYSQL_USER }}

        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dotnet-build

      - name: Verify build artifacts
        run: |
          echo "Contenido de UnitTests:"
          ls -la ProyectoApi.UnitTests/bin/Release/net10.0/

      - name: Wait for MySQL
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        run: |
          echo "Esperando a que MySQL esté disponible..."

          for i in {1..30}; do

            if docker run --rm \
              --network host \
              mysql:8.0 \
              mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u "${MYSQL_ROOT_USER}" \
              -p"${MYSQL_ROOT_PASSWORD}" \
              --silent; then

              echo "MySQL está listo."
              exit 0
            fi

            echo "Intento $i/30 - MySQL todavía no está disponible."
            sleep 2

          done

          echo "ERROR: MySQL no estuvo disponible."

          docker ps -a

          exit 1

      - name: Test database connection
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=${{ secrets.MYSQL_DATABASE }};User=${{ secrets.MYSQL_USER }};Password=${{ secrets.MYSQL_ROOT_PASSWORD }};"

        run: |
          dotnet vstest \
          ./ProyectoApi.UnitTests/bin/Release/net10.0/ProyectoApi.UnitTests.dll \
          --TestCaseFilter:"FullyQualifiedName~DatabaseConnection" \
          --Logger:"console;verbosity=normal"

  docker-verify:
    name: Verify docker

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Docker installation
        run: |
          docker --version
          docker compose version

  docker-validate:
    name: Validate Docker Compose

    runs-on: ubuntu-24.04

    needs:
      - docker-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: |
          docker compose config

  docker-build-push:
    name: Build and Push Docker Image

    runs-on: ubuntu-24.04

    needs:
      - docker-validate
      - build-pipeline

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ProyectoApi.Api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/proyectoapi:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/proyectoapi:latest

  deploy-local:
    name: Prepare Local Docker Image

    runs-on: ubuntu-24.04

    needs:
      - docker-build-push

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_TARGET == 'local'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proyectoapi" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GHCR image
        run: |
          echo "Validando imagen..."

          docker manifest inspect \
            "${IMAGE_NAME}:${{ github.sha }}"

          echo "Imagen disponible en GHCR."

      - name: Show local deployment command
        run: |
          echo "docker pull ${IMAGE_NAME}:${{ github.sha }}"

  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-24.04

    needs:
      - docker-build-push

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_TARGET == 'server'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" \
            > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /app/proyectoapi && \
             docker compose pull && \
             docker compose up -d"

  deploy-cloud:
    name: Deploy Cloud
    runs-on: ubuntu-24.04

    needs:
      - docker-build-push

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_TARGET == 'cloud'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" \
            > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

      - name: Add cloud server to known hosts
        run: |
          ssh-keyscan -H \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy cloud
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /app/proyectoapi && \
             docker compose pull && \
             docker compose up -d"
