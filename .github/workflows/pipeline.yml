name: actions-pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

  bd-conection:
    needs: [build-pipeline]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

      - name: Test database connection
        env:
          ConnectionStrings__DefaultConnection: "Server=${{ secrets.MYSQL_SERVER }};Port=${{ secrets.MYSQL_PORT }};Database=${{ secrets.MYSQL_DATABASE }};User=${{ secrets.MYSQL_USER }};Password=${{ secrets.MYSQL_PASSWORD }};"

        run: |
          output=$(dotnet test ./ProyectoApi.slnx \
            --no-build \
            --configuration Release \
            --filter "DatabaseConnection" \
            --logger "console;verbosity=normal" 2>&1) || {
              echo "$output"
              exit 1
            }

          echo "$output"

          if echo "$output" | grep -q "No test matches the given testcase filter"; then
            echo "ERROR: No se encontró ningún test con el filtro especificado."
            exit 1
          fi

      - name: MySQL logs
        if: failure()
        run: |
          echo "======================================"
          echo "DOCKER CONTAINERS"
          echo "======================================"

          docker ps -a

          echo "======================================"
          echo "MYSQL LOGS"
          echo "======================================"

          docker ps -aq --filter "ancestor=mysql:8.0" | \
            xargs -r docker logs
