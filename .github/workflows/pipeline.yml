name: actions-pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./ProyectoApi.slnx

      - name: Build
        run: dotnet build ./ProyectoApi.slnx --no-restore --configuration Release

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-build
          path: |
            ProyectoApi.UnitTests/bin/Release/net10.0/
            ProyectoApi.UnitTests/obj/Release/net10.0/
          retention-days: 1

  bd-conection:
    needs: [build-pipeline]
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download test artifacts
        uses: actions/download-artifact@v5
        with:
          name: dotnet-test-build

      - name: Wait for MySQL
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        run: |
          echo "Esperando a que MySQL esté disponible..."

          for i in {1..30}; do

            if docker run --rm \
              --network host \
              mysql:8.0 \
              mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -p"${MYSQL_ROOT_PASSWORD}" \
              --silent; then

              echo "MySQL está listo."
              exit 0
            fi

            echo "Intento $i/30 - MySQL todavía no está disponible."
            sleep 2

          done

          echo "ERROR: MySQL no estuvo disponible."

          docker ps -a

          exit 1

      - name: Test database connection
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=${{ secrets.MYSQL_DATABASE }};User=root;Password=${{ secrets.MYSQL_ROOT_PASSWORD }};"

        run: |
          output=$(dotnet test ./ProyectoApi.slnx \
            --no-build \
            --configuration Release \
            --filter "DatabaseConnection" \
            --logger "console;verbosity=normal" 2>&1) || {
              echo "$output"
              exit 1
            }

          echo "$output"

          if echo "$output" | grep -q "No test matches the given testcase filter"; then
            echo "ERROR: No se encontró ningún test con el filtro especificado."
            exit 1
          fi

      - name: MySQL logs
        if: failure()
        run: |
          echo "======================================"
          echo "DOCKER CONTAINERS"
          echo "======================================"

          docker ps -a

          echo "======================================"
          echo "MYSQL LOGS"
          echo "======================================"

          docker ps -aq --filter "ancestor=mysql:8.0" | \
            xargs -r docker logs
